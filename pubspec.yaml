name: cpu_scheduling_algorithm
description: "Cpu Scheduling Algorithm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  msix: ^3.16.13

flutter:
  uses-material-design: true

  assets:
    - assets/cpu_scheduling_logo.png

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/cpu_scheduling_logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#1E1E2C"
  image: "assets/cpu_scheduling_logo.png"
  android_12:
    image: "assets/cpu_scheduling_logo.png"
    color: "#1E1E2C"
  fullscreen: true

msix_config:
  display_name: CPU Visualizer
  publisher_display_name: Mohit Prajapati
  publisher: CN=D8477C68-B7A2-46A9-866B-C8956F523B75
  identity_name: com.mohit.cpuscheduling
  msix_version: 1.0.0.0
  build: true
  logo_path: assets/cpu_scheduling_logo.png
  capabilities: internetClient, location

